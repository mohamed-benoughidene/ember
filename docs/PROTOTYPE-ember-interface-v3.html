  :root {
    --ground: #D6CCBA; --surface: #E9E2D4; --surface-2: #DDD3C1; --surface-3: #CFC4B0;
    --ink: #2B2118; --ink-2: #5A4B3D; --line: #CBBFAA; --line-strong: #8E8068; --paper-border: #CBBFAA;
    --nav-bg: #2B2118; --nav-ink: #E9E2D4;
    --accent: #9C3B2B; --accent-hover: #7A2D20; --accent-ink: #FFFFFF; --focus: #9C3B2B; --danger: #9C3B2B;
    --heat: #B8421F; --sel-bg: #E9E2D4; --sel-ink: #2B2118; --warn-bg: #E0C88F; --warn-ink: #3A2A0A;
    --row-sel-bg: #CFC4B0; --row-sel-ink: #2B2118; --banner-bg: #2B2118; --banner-ink: #E9E2D4;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    --r: 6px;
    /* spacing: Apple-derived steps (4 6 8 12 16 20 32 pt). rem so they scale with the Text size setting, like Apple ScaledMetric. */
    --s1: .267rem; --s2: .4rem; --s3: .533rem; --s4: .8rem; --s5: 1.067rem; --s6: 1.333rem; --s7: 2.133rem;
  }
  :root[data-type="atkinson"] { --font: 'Atkinson Hyperlegible Next', system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; --mono: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  :root[data-type="lexend"] { --font: 'Lexend', system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  :root[data-theme="dark"] {
    --ground: #14100E; --surface: #1D1714; --surface-2: #261E1A; --surface-3: #342A24;
    --ink: #EDEAE6; --ink-2: #B0ABA4; --line: #2E2520; --line-strong: #5C4E44; --paper-border: #5C4E44;
    --nav-bg: #0D0A09; --nav-ink: #E6E2DC;
    --accent: #EDEAE6; --accent-hover: #F5C090; --accent-ink: #17110E; --focus: #F5C090; --danger: #F5C090;
    --heat: #F08A3E; --sel-bg: #F5C090; --sel-ink: #3D0C02; --warn-bg: #4A2F14; --warn-ink: #F5C090;
    --row-sel-bg: #3A2C1F; --row-sel-ink: #EDEAE6; --banner-bg: #0D0A09; --banner-ink: #E6E2DC;
  }
  * { box-sizing: border-box; }
  html { font-size: 15px; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 1rem/1.5 var(--font); min-height: 100vh; padding-bottom: 110px; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--sel-bg); color: var(--sel-ink); }
  input, textarea { caret-color: var(--accent); }
  * { scrollbar-color: var(--line-strong) transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button, .row-click { transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out; }

  .banner, .demo, .demo * { font-size: 13px !important; }
  .banner { background: var(--banner-bg); color: var(--banner-ink); padding: var(--s3) var(--s6); font-size: .87rem; }
  .stage { display: flex; padding: var(--s6) var(--s5); gap: var(--s5); justify-content: center; }
  .stage.pop { align-items: flex-start; min-height: 640px; }
  .stage.pop.pos-br { justify-content: flex-end; align-items: flex-end; }
  .desk { flex: 1; background: var(--surface-2); color: var(--ink-2); display: none; align-items: center; justify-content: center; min-height: 560px; }
  .stage.pop .desk { display: flex; position: absolute; left: 16px; right: 16px; top: 76px; bottom: 76px; z-index: 0; }
  .stage.pop .win { position: relative; z-index: 1; }

  .win.setup { height: auto !important; min-height: 0 !important; }
  .setup-grid { display: grid; grid-template-columns: 17rem 1fr; gap: var(--s7); align-items: start; }
  .setup-grid .form { max-width: 38rem; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { padding: var(--s3) 0; color: var(--ink-2); display: flex; gap: var(--s3); }
  .steps li[aria-current="step"] { color: var(--ink); font-weight: 600; }
  .steps li .n { min-width: 1.4rem; font-weight: 600; }
  .win { background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r); }
  .stage.full .win { width: 100%; max-width: 1180px; height: min(740px, calc(100vh - 150px)); min-height: 560px; }
  .stage.pop .win { width: 440px; max-width: 100%; }

  .titlebar { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s5); background: var(--surface-2); border-bottom: 1px solid var(--paper-border); font-weight: 600; }
  .titlebar img { height: 1.5rem; width: auto; display: block; }
  :root[data-theme="dark"] .titlebar img { filter: brightness(2.2) saturate(1.2); }
  .titlebar .sp { flex: 1; }
  /* ember soul */
  .heat { flex: 0 0 auto; display: inline-block; vertical-align: -1px; }
  .st { display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; }
  .st.challenged { font-weight: 600; }
  .st.closed { color: var(--ink-2); }
  .mono, td.num, th.num, .fig { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lineage { list-style: none; margin: var(--s2) 0 0; padding: 0; }
  .lineage li { display: flex; gap: var(--s3); align-items: baseline; padding: var(--s1) 0; }
  .lineage .k { flex: 0 0 11rem; color: var(--ink-2); }
  @keyframes heat-light { 0% { transform: scale(.4); opacity: .25; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes heat-half { 0% { transform: rotate(-120deg) scale(.7); opacity: .4; } 100% { transform: none; opacity: 1; } }
  @keyframes heat-cool { 0% { transform: scale(1.3); opacity: .35; } 100% { transform: none; opacity: 1; } }

  .seg { flex-wrap: wrap; }

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = n => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const item = id => D.items.find(i => i.id === id);
const heat = (s, id) => '<svg class="heat" data-s="' + s + '"' + (id ? ' data-id="' + id + '"' : '') + ' viewBox="0 0 12 12" width="12" height="12" role="img" aria-label="' + s + '">' + (s === 'Active' ? '<circle cx="6" cy="6" r="5" fill="var(--heat)"/>' : s === 'Challenged' ? '<circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--heat)" stroke-width="1.6"/><path d="M6 1.8a4.2 4.2 0 0 0 0 8.4z" fill="var(--heat)"/>' : '<circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--ink-2)" stroke-width="1.4"/>') + '</svg>';
const pill = (s, id) => `<span class="st ${s.toLowerCase()}">${heat(s, id)}<span>${s}</span></span>`;
const snap = () => JSON.stringify({ items: D.items, links: D.links });
function pushUndo(label, before) { S.undo.push({ label, before, after: snap() }); S.redo = []; }
function doUndo() { const e = S.undo.pop(); if (!e) return; const b = JSON.parse(e.before); D.items = b.items; D.links = b.links; log('Undone: ' + e.label + '.'); S.redo.push(e); S.fixMsg = 'Undone: ' + e.label + '. The ledger keeps both lines.'; }
function doRedo() { const e = S.redo.pop(); if (!e) return; const a = JSON.parse(e.after); D.items = a.items; D.links = a.links; log('Redone: ' + e.label + '.'); S.undo.push(e); S.fixMsg = 'Redone: ' + e.label + '.'; }
const undoBar = () => `<div class="actions" style="margin-top:0"><button class="btn" data-act="undo" ${S.undo.length ? '' : 'disabled'} title="${isMac() ? 'Command' : 'Ctrl'}+Z">Undo${S.undo.length ? ' ' + esc(S.undo[S.undo.length - 1].label) : ''}</button><button class="btn" data-act="redo" ${S.redo.length ? '' : 'disabled'} title="Shift+${isMac() ? 'Command' : 'Ctrl'}+Z">Redo${S.redo.length ? ' ' + esc(S.redo[S.redo.length - 1].label) : ''}</button></div>`;
const savedList = ids => ids.length ? `<p class="help" style="margin:var(--s5) 0 var(--s2)">Saved so far</p><div class="panel"><table><tbody>${ids.map(id => { const it = item(id); return `<tr><td class="num dim" style="width:3rem">${id}</td><td>${esc(it.text)}</td><td style="width:7rem">${pill(it.status, id)}</td></tr>`; }).join('')}</tbody></table></div>` : '';
const count = st => D.items.filter(i => i.status === st).length;
const nextId = () => Math.max(...D.items.map(i => i.id)) + 1;
const nowStamp = () => '30 Oct ' + ('0' + (9 + Math.floor(D.ledger.length / 6))).slice(-2) + ':' + ('0' + ((D.ledger.length * 7) % 60)).slice(-2);
const log = t => D.ledger.push({ t: nowStamp(), text: t });
const liveLinks = () => D.links.filter(l => !l.rejected);
const skel = (w, h = 14) => `<span class="skel" style="width:${w};height:${h}px;margin:var(--s2) 0"></span>`;

function sweepChanges() {
  const ch = [];
  const closed = id => item(id).status === 'Closed';
  liveLinks().forEach(l => {
    const to = item(l.to), from = item(l.from);
    if (l.type === 'supersedes' && to.status !== 'Closed') ch.push({ id: to.id, to: 'Closed', reason: 'superseded', why: `item ${l.from} supersedes it` });
    if (l.type === 'answers' && to.type === 'Question' && to.status !== 'Closed') ch.push({ id: to.id, to: 'Closed', reason: 'answered', why: `item ${l.from} answers it` });
    if (l.type === 'contradicts' && to.status === 'Active') ch.push({ id: to.id, to: 'Challenged', why: `item ${l.from} contradicts it` });
    if (l.type === 'depends_on' && to.status === 'Closed' && ['invalidated','superseded'].includes(to.reason) && from.status === 'Active') ch.push({ id: from.id, to: 'Challenged', why: `it depends on closed item ${l.to}` });
  });
  return ch.filter((c, i, a) => a.findIndex(x => x.id === c.id && x.to === c.to) === i);
}

/* ---------- views ---------- */
function titleRow(h, sub, action) { return `<div class="titlerow"><div class="grow"><h1>${h}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${action || ''}</div>`; }
function noKeyBlock(what) {
  return `<div class="errbox"><strong>${what} needs the AI connection.</strong><span class="dim">Ember has no AI key yet. Everything else works without one: Look up, Fix and close, Clean up and Keep safe.</span><div class="actions"><button class="btn primary" data-act="gotosettings">Set up the AI connection</button></div></div>`;
}
const needsKey = () => S.demo === 'nokey' || !S.hasKey;

function homeView() {
  const pending = sweepChanges().length;
  const ch = D.items.filter(i => i.status === 'Challenged');
  let finding;
  if (pending > 0) finding = `<div class="finding"><div class="grow"><strong>${pending} ${pending === 1 ? 'item is' : 'items are'} out of date.</strong><span>The links say their status should change. A sweep updates them. Nothing changes until you apply it.</span></div><button class="btn" data-act="job" data-job="clean">Preview the sweep</button></div>`;
  else if (ch.length) finding = `<div class="finding"><div class="grow"><strong>${ch.length} ${ch.length === 1 ? 'item needs' : 'items need'} a second look.</strong><span>Item ${ch[0].id}, "${esc(ch[0].text)}", is Challenged. A link contradicts it.</span></div><button class="btn" data-act="reviewitem" data-id="${ch[0].id}">Review item ${ch[0].id}</button></div>`;
  else finding = `<div class="finding"><div class="grow"><strong>Nothing needs attention.</strong><span>Every status matches its links.</span></div></div>`;
  const latest = D.ledger.slice(-4).reverse().map(e => `<tr><td class="dim mono" style="white-space:nowrap">${e.t}</td><td>${esc(e.text)}</td></tr>`).join('');
  return titleRow('Home', 'What this knowledge base knows right now.', `<button class="btn primary" data-act="job" data-job="add">Add text</button>`) + finding +
    `<div class="panel split" aria-label="Items by status"><div><div class="lbl st">${heat('Active')}<span>Active</span></div><div class="fig">${count('Active')}</div></div><div><div class="lbl st">${heat('Challenged')}<span>Challenged</span></div><div class="fig">${count('Challenged')}</div></div><div><div class="lbl st">${heat('Closed')}<span>Closed</span></div><div class="fig">${count('Closed')}</div></div><div><div class="lbl">All items</div><div class="fig">${D.items.length}</div></div></div>
     <h2>Latest in the ledger</h2><div class="panel"><table><tbody>${latest}</tbody></table></div>
     <div class="actions"><button class="btn text" data-act="ledger">View the whole ledger</button></div>`;
}

function addView() {
  const head = titleRow('Add', 'Paste text. Ember proposes items: a decision, assumption, finding or question. Only the ones you confirm are saved.');
  if (needsKey()) return head + noKeyBlock('Adding text');
  if (S.addStep === 'input') {
    return head + `<label for="src">Your text</label><textarea id="src" aria-describedby="srchelp">${esc(S.srcText)}</textarea>
      <p class="help" id="srchelp">Your text is kept word for word as a Source. It is sent to an AI service to find proposals.</p>
      <div class="actions"><button class="btn primary" data-act="findprops">Find items</button></div>`;
  }
  if (S.addStep === 'loading' || S.demo === 'loading' && S.addStep === 'props') {
    return head + `<div class="panel"><div class="pad">${skel('40%', 16)}${skel('85%', 22)}${skel('70%', 14)}<div class="actions">${skel('7rem', 38)}${skel('7rem', 38)}</div></div></div><p class="help">Reading your text. Nothing is saved yet.</p>`;
  }
  if (S.addStep === 'error') {
    return head + `<div class="errbox"><strong>Couldn't reach the AI service.</strong><span class="dim">Your text is saved as a Source. No items were created. Last attempt just now.</span><div class="actions"><button class="btn" data-act="findprops">Try again</button><button class="btn text" data-act="addreset">Edit the text</button></div></div>`;
  }
  if (S.addStep === 'empty') {
    return head + `<div class="empty">Ember found nothing to propose in this text. The text is kept as a Source.<div class="actions" style="justify-content:center"><button class="btn" data-act="addreset">Add other text</button></div></div>`;
  }
  if (S.addStep === 'done') {
    return head + `<div class="ok"><strong>Done.</strong> ${S.accepted.length} confirmed, ${S.rejectedN} rejected.${S.accepted.length ? ` New items: ${S.accepted.join(', ')}.` : ''}</div>
      <div class="actions">${S.accepted.length ? `<button class="btn primary" data-act="job" data-job="link">Link the new items</button>` : ''}<button class="btn" data-act="addreset">Add more text</button></div>` + savedList(S.accepted);
  }
  const p = S.props[S.propIdx];
  const body = S.editing
    ? `<label for="edt">Type</label><select id="edtt"><option ${p.type==='Decision'?'selected':''}>Decision</option><option ${p.type==='Assumption'?'selected':''}>Assumption</option><option ${p.type==='Finding'?'selected':''}>Finding</option><option ${p.type==='Question'?'selected':''}>Question</option></select>
       <label for="edt">Statement</label><input type="text" id="edt" value="${esc(p.text)}"><div class="actions"><button class="btn primary" data-act="saveedit">Save change</button><button class="btn" data-act="canceledit">Cancel</button></div>`
    : `<div class="lbl">${p.type}</div><p style="margin:.15rem 0 0;font-size:1.15rem">${esc(p.text)}</p><p class="help">From your text: "${esc(p.quote)}"</p>
       ${p.warn ? `<p class="help" style="color:var(--ink)"><strong>Check:</strong> ${esc(p.warn)}</p>` : ''}
       <div class="actions end"><button class="btn text" data-act="stop" style="margin-right:auto">Stop<span class="kbd">Esc</span></button><button class="btn" data-act="edit">Edit<span class="kbd">e</span></button><button class="btn" data-act="rejectp">Reject<span class="kbd">n</span></button><button class="btn primary" data-act="confirm">Confirm<span class="kbd">Return</span></button></div>`;
  return head + `<p class="help" style="margin:0 0 var(--s3)">Proposal ${S.propIdx + 1} of ${S.props.length}. Ember only proposes. You decide.</p><div class="panel tone"><div class="pad">${body}</div></div>` + savedList(S.accepted);
}

function lookView() {
  const t = S.lookTab;
  const tabs = `<div class="tabs" role="tablist"><button role="tab" data-act="lookTab" data-tab="items" aria-selected="${t==='items'}">Items</button><button role="tab" data-act="lookTab" data-tab="ledger" aria-selected="${t==='ledger'}">Ledger</button></div>`;
  const head = titleRow('Look up', 'Find what the project knows. Nothing here changes your data.');
  if (S.demo === 'loading') return head + tabs + `<div class="panel"><div class="pad">${skel('90%')}${skel('80%')}${skel('88%')}${skel('60%')}</div></div>`;
  if (S.demo === 'error') return head + tabs + `<div class="errbox"><strong>Couldn't read the knowledge base file.</strong><span class="dim">The file may have moved. Last read 09:14.</span><div class="actions"><button class="btn" data-act="resetdemo">Try again</button></div></div>`;
  if (t === 'ledger') {
    return head + tabs + `<div class="panel"><table><thead><tr><th>When</th><th>What changed</th></tr></thead><tbody>${D.ledger.slice().reverse().map(e => `<tr><td class="dim mono" style="white-space:nowrap">${e.t}</td><td>${esc(e.text)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const q = S.q.trim().toLowerCase();
  const rows = (S.demo === 'empty' ? [] : D.items.filter(i => (!q || i.text.toLowerCase().includes(q)) && (S.fStatus === 'Any status' || i.status === S.fStatus) && (S.fType === 'Any type' || i.type === S.fType)));
  const rel = (l, id) => {
    const o = id === l.from ? item(l.to) : item(l.from), out = id === l.from;
    const lab = { contradicts: out ? 'Challenges' : 'Challenged by', supersedes: out ? 'Replaces' : 'Replaced by', answers: out ? 'Answers' : 'Answered by', depends_on: out ? 'Depends on' : 'Needed by', supports: out ? 'Supports' : 'Supported by' }[l.type];
    return `<li><span class="k">${lab}</span><span>${heat(o.status, o.id)} <span class="mono">${o.id}</span> ${esc(o.text)}</span></li>`;
  };
  const why = id => {
    const it = item(id), ls = liveLinks().filter(l => l.from === id || l.to === id);
    return `<tr><td></td><td colspan="3"><ul class="lineage"><li><span class="k">Source</span><span>${esc(it.source)}</span></li>${it.rationale ? `<li><span class="k">Why</span><span>${esc(it.rationale)}</span></li>` : ''}${ls.map(l => rel(l, id)).join('') || '<li><span class="k">Links</span><span class="dim">None yet.</span></li>'}${it.status === 'Closed' ? `<li><span class="k">Closed because</span><span>${it.reason}</span></li>` : ''}</ul></td></tr>`;
  };
  const body = rows.length ? `<div class="panel"><table><thead><tr><th class="num" style="width:3rem">No.</th><th style="width:8rem">Type</th><th>Item</th><th style="width:7rem">Status</th></tr></thead><tbody>${rows.map(i => `<tr class="row-click" data-act="openrow" data-id="${i.id}" tabindex="0" aria-expanded="${S.open === i.id}"><td class="num dim">${i.id}</td><td class="dim">${i.type}</td><td>${esc(i.text)}</td><td>${pill(i.status, i.id)}</td></tr>${S.open === i.id ? why(i.id) : ''}`).join('')}</tbody></table></div>`
    : `<div class="empty">${S.demo === 'empty' ? 'No items yet.' : `No items match${q ? ` "${esc(S.q)}"` : ' these filters'}.`}<div class="actions" style="justify-content:center"><button class="btn" data-act="clearfilters">Clear filters</button></div></div>`;
  return head + tabs + `<label for="q" style="margin-top:0">Search items</label><div class="filters"><input type="text" id="q" value="${esc(S.q)}"><select id="fs" aria-label="Status">${['Any status','Active','Challenged','Closed'].map(o => `<option ${o===S.fStatus?'selected':''}>${o}</option>`).join('')}</select><select id="ft" aria-label="Type">${['Any type','Decision','Assumption','Finding','Question'].map(o => `<option ${o===S.fType?'selected':''}>${o}</option>`).join('')}</select></div>
    <p class="help" style="margin:var(--s3) 0">${rows.length} of ${D.items.length} items. Select a row to see why.</p>` + body;
}

function linkView() {
  const head = titleRow('Link items', 'Ember proposes how items relate: supports, contradicts, supersedes, answers or depends on. You confirm each link.');
  if (needsKey()) return head + noKeyBlock('Linking');
  if (S.demo === 'loading') return head + `<div class="panel"><div class="pad">${skel('60%', 18)}${skel('40%')}${skel('70%', 18)}</div></div><p class="help">Preparing the language model. The first time only, this can take minutes.</p>`;
  if (S.demo === 'error') return head + `<div class="errbox"><strong>Couldn't prepare the language model.</strong><span class="dim">No links were changed.</span><div class="actions"><button class="btn" data-act="resetdemo">Try again</button></div></div>`;
  if (S.demo === 'empty' || S.linkIdx >= LINK_PROPOSALS.length) {
    return head + (S.linkIdx >= LINK_PROPOSALS.length && S.demo !== 'empty'
      ? `<div class="ok"><strong>Done.</strong> ${S.linkDone} confirmed, ${S.linkSkipped} skipped or rejected.</div><div class="actions"><button class="btn" data-act="linkreset">Start over</button></div>`
      : `<div class="empty">No unrelated items are left to link.</div>`);
  }
  const l = LINK_PROPOSALS[S.linkIdx], a = item(l.from), b = item(l.to);
  return head + `<p class="help" style="margin:0 0 var(--s3)">Proposal ${S.linkIdx + 1} of ${LINK_PROPOSALS.length}.</p><div class="panel tone"><div class="pad"><div><span class="dim">Item ${a.id}</span> ${esc(a.text)}</div><div style="margin:var(--s2) 0"><strong>${l.type.replace('_', ' ')}</strong></div><div><span class="dim">Item ${b.id}</span> ${esc(b.text)}</div>
    <div class="actions end"><button class="btn" data-act="linkskip">Skip<span class="kbd">s</span></button><button class="btn" data-act="linkno">Reject<span class="kbd">n</span></button><button class="btn primary" data-act="linkyes">Confirm<span class="kbd">Return</span></button></div></div></div>`;
}

function fixView() {
  const it = item(S.sel);
  const head = titleRow('Fix and close', 'Change an item or a link. Every change is written to the ledger, and Undo adds a new line instead of erasing one. Closing needs a preview first.', undoBar());
  if (S.demo === 'error') return head + `<div class="errbox"><strong>Couldn't save the change.</strong><span class="dim">Nothing was changed.</span><div class="actions"><button class="btn" data-act="resetdemo">Try again</button></div></div>`;
  const list = `<div class="panel"><table><thead><tr><th class="num" style="width:3rem">No.</th><th>Item</th><th style="width:7rem">Status</th></tr></thead><tbody>${D.items.map(i => `<tr class="row-click" data-act="selitem" data-id="${i.id}" tabindex="0" ${i.id === S.sel ? 'style="background:var(--row-sel-bg);color:var(--row-sel-ink)"' : ''}><td class="num ${i.id === S.sel ? '' : 'dim'}">${i.id}</td><td>${esc(i.text)}</td><td>${pill(i.status, i.id)}</td></tr>`).join('')}</tbody></table></div>`;
  const closed = it.status === 'Closed';
  const dependents = liveLinks().filter(l => l.type === 'depends_on' && l.to === it.id).map(l => item(l.from)).filter(i => i.status === 'Active');
  let preview = '';
  if (S.previewed && !closed) {
    preview = S.closeReason === 'invalidated'
      ? `<div class="ok"><strong>Preview.</strong> Item ${it.id} would close as invalidated. ${dependents.length} ${dependents.length === 1 ? 'item that depends' : 'items that depend'} on it would become Challenged${dependents.length ? ': ' + dependents.map(d => 'item ' + d.id).join(', ') : ''}. Nothing has changed yet.</div>`
      : `<div class="ok"><strong>Preview.</strong> Item ${it.id} would close as expired. The effect on dependent items is not drawn in this prototype.</div>`;
  }
  const confirmClose = S.closeAsk ? `<div class="inline-confirm"><strong>Close item ${it.id}, "${esc(it.text)}"?</strong><div class="dim">This cannot be undone from here. Only the ledger keeps its history.</div><div class="actions"><button class="btn danger" data-act="doclose">Close item ${it.id}</button><button class="btn" data-act="cancelclose">Cancel</button></div></div>` : '';
  const editor = S.editField ? `<label for="edf">Edit ${S.editField}</label><input type="text" id="edf" value="${esc(it[S.editField])}"><div class="actions"><button class="btn primary" data-act="saveedf">Save</button><button class="btn" data-act="canceledf">Cancel</button></div>` : '';
  const linkRows = liveLinks().map(l => `<tr><td class="num dim">${l.id}</td><td>Item ${l.from} <strong>${l.type.replace('_',' ')}</strong> item ${l.to}</td><td class="num"><button class="btn text" data-act="rmlink" data-id="${l.id}">Remove</button>${l.type === 'supersedes' ? `<button class="btn text" data-act="revsup" data-id="${l.id}">Undo replacement</button>` : ''}</td></tr>`).join('');
  return head + list +
    `<h2>Item ${it.id}</h2><div class="panel tone"><div class="pad"><div class="lbl">${it.type}${it.validated ? ' (verified)' : ''}</div><p style="margin:.15rem 0 var(--s3);font-size:1.1rem">${esc(it.text)} ${pill(it.status, it.id)}</p>${closed ? `<p class="help">Closed: ${it.reason}.</p>` : ''}
      <div class="actions"><button class="btn" data-act="setstatus" data-to="Active" ${it.status !== 'Challenged' ? 'disabled' : ''}>Mark Active</button><button class="btn" data-act="setstatus" data-to="Challenged" ${it.status !== 'Active' ? 'disabled' : ''}>Mark Challenged</button>
      <button class="btn" data-act="togglevalid" ${it.type !== 'Assumption' ? 'disabled' : ''}>${it.validated ? 'Clear verified' : 'Mark verified'}</button><button class="btn" data-act="editf" data-f="rationale" ${it.type !== 'Decision' ? 'disabled' : ''}>Edit rationale</button><button class="btn" data-act="editf" data-f="source" ${it.type !== 'Finding' ? 'disabled' : ''}>Edit source</button></div>
      <p class="why-off">${closed ? 'Status buttons are off because a Closed item cannot change status. ' : ''}${it.type !== 'Assumption' ? 'Verified applies to assumptions only. ' : ''}${it.type !== 'Decision' ? 'Rationale can be edited on a Decision. ' : ''}${it.type !== 'Finding' ? 'Source can be edited on a Finding.' : ''}</p>${editor}${S.fixMsg ? `<div class="ok">${esc(S.fixMsg)}</div>` : ''}</div></div>
     <h2>Close this item</h2>${closed ? '<p class="help">Already closed.</p>' : `<div class="actions" style="margin-top:0"><select id="cr" aria-label="Reason"><option value="invalidated" ${S.closeReason==='invalidated'?'selected':''}>It was wrong (invalidated)</option><option value="expired" ${S.closeReason==='expired'?'selected':''}>It ran out (expired)</option></select><button class="btn" data-act="previewclose">Preview closing</button></div>${preview}${S.previewed ? `<div class="actions"><button class="btn danger" data-act="askclose">Close item ${it.id}…</button></div>` : ''}${confirmClose}`}
     <h2>Links</h2><div class="panel"><table><tbody>${linkRows || '<tr><td class="dim">No links.</td></tr>'}</tbody></table></div><p class="help">Removing a link marks it Rejected. Ember never deletes it.</p>`;
}

function cleanView() {
  const head = titleRow('Clean up', 'A sweep checks every confirmed link and updates item statuses by fixed rules. Preview first, then apply.');
  if (S.demo === 'loading') return head + `<div class="panel"><div class="pad">${skel('80%')}${skel('65%')}</div></div>`;
  if (S.demo === 'error') return head + `<div class="errbox"><strong>Couldn't finish the sweep.</strong><span class="dim">Nothing was changed. Ember applies a sweep in one step or not at all.</span><div class="actions"><button class="btn" data-act="resetdemo">Try again</button></div></div>`;
  const ch = sweepChanges();
  let body = '';
  if (S.sweepApplied !== null) body = `<div class="ok"><strong>Done.</strong> ${S.sweepApplied} ${S.sweepApplied === 1 ? 'item' : 'items'} changed. The ledger shows why.</div><div class="panel" style="margin-top:var(--s4)"><table><tbody>${(S.sweepChanged || []).map(c => { const it = item(c.id); return `<tr><td class="num dim" style="width:3rem">${c.id}</td><td>${esc(it.text)}</td><td style="width:9rem">${pill(it.status, c.id)}</td><td class="dim">${c.why}</td></tr>`; }).join('')}</tbody></table></div><p class="help">After a sweep, Ember may also propose closing old questions that have an answer. That step is not drawn here.</p>`;
  else if (!S.sweepPreview) body = '<p class="help">Apply stays off until you preview.</p>';
  else if (!ch.length || S.demo === 'empty') body = `<div class="empty">Nothing to update. Every status matches its links.</div>`;
  else body = `<div class="panel"><table><thead><tr><th class="num" style="width:3rem">No.</th><th>Item</th><th>Becomes</th><th>Because</th></tr></thead><tbody>${ch.map(c => `<tr><td class="num dim">${c.id}</td><td>${esc(item(c.id).text)}</td><td>${pill(c.to)}</td><td class="dim">${c.why}</td></tr>`).join('')}</tbody></table></div>`;
  return head + `<div class="actions" style="margin-top:0"><button class="btn" data-act="sweeppreview">Preview the sweep</button><button class="btn primary" data-act="sweepapply" ${S.sweepPreview && ch.length && S.sweepApplied === null ? '' : 'disabled'}>Apply ${S.sweepPreview && ch.length && S.sweepApplied === null ? ch.length + ' ' + (ch.length === 1 ? 'change' : 'changes') : 'changes'}</button></div><div style="margin-top:var(--s5)">${body}</div>`;
}

function safeView() {

const PANES = ['Appearance', 'Quick popup', 'Menu', 'AI connection'];
const SCALES = ['Small', 'Default', 'Large', 'Larger', 'Largest'];
const SCALE_PX = { Small: 14, Default: 15, Large: 17, Larger: 22, Largest: 30 };
const isMac = () => S.os === 'mac';
const KEYNAME = () => isMac() ? { Control: 'Control', Alt: 'Option', Shift: 'Shift', Meta: 'Command' } : { Control: 'Ctrl', Alt: 'Alt', Shift: 'Shift', Meta: 'Meta' };
const MOD_ORDER = ['Control', 'Alt', 'Shift', 'Meta'];
const defaultKeys = () => isMac() ? ['Alt', 'Meta', 'E'] : ['Control', 'Alt', 'E'];
const curKeys = () => S.shortcutKeys || defaultKeys();
const STANDARD_MAC = ['A','B','C','F','G','H','I','J','M','N','O','P','Q','S','T','U','V','W','X','Z','E'];
function shortcutWarning(keys) {
  const mods = keys.filter(k => MOD_ORDER.includes(k)), key = keys.find(k => !MOD_ORDER.includes(k));
  if (!mods.length) return 'Add a modifier key, so typing does not open the popup.';

  if (isMac() && mods.length === 1 && mods[0] === 'Meta' && STANDARD_MAC.includes(key)) return 'Command+' + key + ' is a standard Mac shortcut. Choose another.';
  return '';
}
function settingsView() {
  const seg = (name, opts, cur) => `<div class="seg" role="group" aria-label="${name}">${opts.map(o => `<button data-act="set" data-k="${name}" data-v="${o}" aria-pressed="${o === cur}">${o}</button>`).join('')}</div>`;
  const row = (t, d, r) => `<div class="setrow"><div class="l"><b>${t}</b><span>${d}</span></div><div class="r">${r}</div></div>`;
  const menu = S.menuOrder.map((id, i) => { const j = JOBS.find(x => x.id === id); return `<li><label><input type="checkbox" data-act="togglemenu" data-id="${id}" ${S.menuHidden.includes(id) ? '' : 'checked'}> ${j.name}</label><button class="btn text" data-act="moveup" data-id="${id}" ${i === 0 ? 'disabled' : ''} aria-label="Move ${j.name} up">Up</button><button class="btn text" data-act="movedown" data-id="${id}" ${i === S.menuOrder.length - 1 ? 'disabled' : ''} aria-label="Move ${j.name} down">Down</button></li>`; }).join('');
  const names = KEYNAME();
  const shown = curKeys().slice().sort((a, b) => (MOD_ORDER.indexOf(a) < 0 ? 9 : MOD_ORDER.indexOf(a)) - (MOD_ORDER.indexOf(b) < 0 ? 9 : MOD_ORDER.indexOf(b)));
  const warn = shortcutWarning(curKeys());
  const tabs = `<div class="tabs" role="tablist" aria-label="Settings panes">${PANES.map(p => `<button role="tab" data-act="pane" data-p="${p}" aria-selected="${p === S.pane}">${p}</button>`).join('')}</div>`;

    row('Colours', 'Light is warm paper. Dark is soot.', seg('Colours', ['Light', 'Dark'], S.theme === 'dark' ? 'Dark' : 'Light'));
  else if (S.pane === 'Quick popup') body =
    row('Shortcut', 'The keys that open the small window for adding text from anywhere.', `<div>${S.capturing ? '<span class="kbdkey">Press the new keys…</span> <button class="btn text" data-act="cancelcap">Cancel</button>' : shown.map(k => `<span class="kbdkey">${names[k] || k}</span>`).join('') + ' <button class="btn" data-act="capture">Change keys</button>' + (S.shortcutKeys ? ' <button class="btn text" data-act="resetkeys">Use the default</button>' : '')}</div>${warn ? `<p class="help" style="color:var(--ink)"><strong>Check:</strong> ${esc(warn)}</p>` : ''}<p class="help">If another program already uses these keys, the popup will not open. Choose other keys, or click Ember's tray icon.</p>`) +
    row('Position', 'Where the popup appears.', `<select id="pp" aria-label="Where it appears">${['Top centre', 'Bottom right'].map(o => `<option ${o === S.popPos ? 'selected' : ''}>${o}</option>`).join('')}</select>`);

  return titleRow('Settings', `Opens with ${isMac() ? 'Command' : 'Ctrl'}+Comma. Every change saves itself.`) + tabs + `<div class="saved" role="status">${esc(S.saved)}</div>` + body;
}

function firstRunView() {
  const n = S.setupStep;
  const pct = Math.round(((n - 1) / 3) * 100);
  const bar = `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
  let body;
  if (n === 1) body = `<h2 style="margin-top:0">Where should Ember keep your knowledge?</h2><p class="help" style="margin:0 0 var(--s3)">One file holds everything: your items, their links and the ledger. You can back it up later.</p><label for="dbp">Knowledge base file</label><input type="text" id="dbp" value="${esc(S.dbPath)}"><div class="actions"><button class="btn primary" data-act="setupnext">Continue</button></div>`;
  else if (n === 2) {
    const st = S.keyState;
    body = `<h2 style="margin-top:0">Connect an AI service</h2><p class="help" style="margin:0 0 var(--s3)">Ember uses an AI service to propose items and links. It only proposes. You confirm. Your text is sent to that service when you use Add or Link items.</p>
      <label for="key">Your key from openrouter.ai</label><div style="display:flex;gap:var(--s3)"><input type="${S.keyShown ? 'text' : 'password'}" id="key" autocomplete="off" aria-describedby="keyhelp"><button class="btn" data-act="showkey">${S.keyShown ? 'Hide' : 'Show'}</button></div>
      <p class="help" id="keyhelp">A key is a long password that lets Ember use the service. Ember stores it on this computer only.</p>
      ${st === 'checking' ? `<div class="ok">Checking the key…</div>` : ''}${st === 'ok' ? `<div class="ok"><strong>Connected.</strong> The key works.</div>` : ''}${st === 'error' ? `<div class="errbox" style="margin-top:var(--s4)"><strong>${esc(S.keyMsg)}</strong><span class="dim">Nothing was saved.</span></div>` : ''}
      <div class="actions">${st === 'ok' ? '<button class="btn primary" data-act="setupnext">Continue</button>' : '<button class="btn primary" data-act="testkey">Test the key</button>'}<button class="btn text" data-act="skipkey">Skip for now</button></div><p class="help">If you skip, you can still look things up, fix items, clean up and back up. Add and Link items wait for a key.</p>`;
  } else body = `<h2 style="margin-top:0">Ember is ready</h2><p class="help" style="margin:0 0 var(--s3)">Knowledge base file: ${esc(S.dbPath)}. AI connection: ${S.hasKey ? 'connected' : 'not connected yet'}.</p><div class="actions"><button class="btn primary" data-act="finishsetup">${S.hasKey ? 'Add your first text' : 'Open Ember'}</button></div>`;
  const names = ['Knowledge base file', 'AI connection', 'Ready'];

}

function popView() {
  if (!S.setupDone) return `<div class="main"><h1 style="font-size:1.3rem">Finish setup first</h1><p class="sub">Quick add needs the full window to be set up once.</p><div class="actions"><button class="btn primary" data-act="tofull">Open the full window</button></div></div>`;
  if (needsKey()) return `<div class="main"><h1 style="font-size:1.3rem">Quick add</h1>${noKeyBlock('Adding text')}</div>`;
  const inner = (() => {
    if (S.addStep === 'input') return `<label for="src" style="margin-top:0">Paste or type text</label><textarea id="src" style="min-height:5.5rem">${esc(S.srcText)}</textarea><div class="actions"><button class="btn primary" data-act="findprops">Find items</button><button class="btn text" data-act="tofull">Open full window</button></div>`;

}

const VIEWS = { home: homeView, add: addView, look: lookView, link: linkView, fix: fixView, clean: cleanView, safe: safeView, settings: settingsView };

/* The one authored moment: a heat mark settles when its item's status changes (or the item is new). */
const LAST = {}; let READY = false;
function settleMarks() {
  document.querySelectorAll('.heat[data-id]').forEach(el => {
    const id = el.dataset.id, st = el.dataset.s;
    if (READY && LAST[id] !== st) el.classList.add('settle-' + st.toLowerCase());
  });
  D.items.forEach(i => { LAST[i.id] = i.status; });
  READY = true;
}
function render() {
  document.documentElement.dataset.theme = S.theme; document.documentElement.dataset.type = S.type;
  document.documentElement.style.fontSize = SCALE_PX[S.scale] + 'px'; document.documentElement.classList.toggle('big', S.scale === 'Larger' || S.scale === 'Largest');
  const st = $('#stage');
  st.className = 'stage ' + S.shape + (S.shape === 'pop' && S.popPos === 'Bottom right' ? ' pos-br' : '');
  const titlebar = `<div class="titlebar"><img src="${ICON}" alt="Ember"><span>${S.shape === 'full' && S.setupDone && S.job === 'settings' ? 'Ember · Settings · ' + esc(S.pane) : 'Ember'}</span><span class="sp"></span><span class="meta">${esc(S.dbPath.split('/').pop())}</span></div>`;
  const win = $('#win'); win.classList.remove('setup');
  if (S.shape === 'pop') win.innerHTML = titlebar + popView();
  else if (!S.setupDone) { win.classList.add('setup'); win.innerHTML = titlebar + `<div class="main">${firstRunView()}</div>`; }
  else {
    const pending = sweepChanges().length;
    const order = ['home', ...S.menuOrder.filter(id => !S.menuHidden.includes(id)), 'settings'];
    const nav = order.map(id => { const j = JOBS.find(x => x.id === id); const badge = id === 'clean' && pending ? `<span class="count" aria-label="${pending} pending">${pending}</span>` : ((id === 'add' || id === 'link') && needsKey() ? '<span class="tag">Needs AI key</span>' : ''); return `<button data-act="job" data-job="${id}" aria-current="${id === S.job}">${ico(j.icon)}<span class="t">${j.name}<small>${j.hint}</small></span>${badge}</button>`; }).join('');
    win.innerHTML = titlebar + `<div class="shell"><nav class="nav" aria-label="Jobs">${nav}</nav><div class="main">${VIEWS[S.job]()}</div></div>`;
  }
  document.querySelectorAll('.demo [data-shape]').forEach(b => b.setAttribute('aria-pressed', b.dataset.shape === S.shape));
  settleMarks();
  $('#demostate').value = S.demo; $('#os').value = S.os; $('#typeface').value = S.type;
}

function startProps() {
  if (S.demo === 'error') { S.addStep = 'error'; return; }
  if (S.demo === 'empty') { S.addStep = 'empty'; return; }
  S.props = PROPOSALS.map(p => ({ ...p })); S.propIdx = 0; S.accepted = []; S.rejectedN = 0; S.editing = false; S.addStep = 'props';
}
function advance() { S.propIdx++; S.editing = false; if (S.propIdx >= S.props.length) S.addStep = 'done'; }
function addItem(p) { const id = nextId(); D.items.push({ id, type: p.type, text: p.text, status: 'Active', reason: null, validated: false, rationale: '', source: 'Pasted text, today' }); log(`Item ${id} added (${p.type}). Confirmed by you.`); S.accepted.push(id); }

document.addEventListener('click', e => {
  const sh = e.target.closest('[data-shape]'); if (sh) { S.shape = sh.dataset.shape; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = +a.dataset.id;
  const p = S.props[S.propIdx];
  switch (act) {
    case 'job': S.job = a.dataset.job; S.previewed = false; S.closeAsk = false; S.sweepPreview = false; S.fixMsg = ''; if (S.job === 'add' && S.addStep === 'done') S.addStep = 'input'; break;
    case 'gotosettings': S.shape = 'full'; S.job = 'settings'; break;
    case 'tofull': S.shape = 'full'; break;
    case 'findprops': S.srcText = ($('#src') || { value: S.srcText }).value; S.addStep = S.demo === 'loading' ? 'loading' : 'x'; startProps(); break;
    case 'addreset': S.addStep = 'input'; break;
    case 'confirm': addItem(p); advance(); S.undo = []; S.redo = []; break;
    case 'rejectp': S.rejectedN++; advance(); break;
    case 'edit': S.editing = true; break;
    case 'canceledit': S.editing = false; break;
    case 'saveedit': p.text = $('#edt').value; p.type = $('#edtt').value; S.editing = false; break;
    case 'stop': S.rejectedN += S.props.length - S.propIdx; S.addStep = 'done'; break;
    case 'ledger': S.job = 'look'; S.lookTab = 'ledger'; break;
    case 'lookTab': S.lookTab = a.dataset.tab; break;
    case 'openrow': S.open = S.open === id ? null : id; break;
    case 'clearfilters': S.q = ''; S.fStatus = 'Any status'; S.fType = 'Any type'; S.demo = S.demo === 'empty' ? 'normal' : S.demo; break;
    case 'reviewitem': S.job = 'fix'; S.sel = id; break;
    case 'selitem': S.sel = id; S.previewed = false; S.closeAsk = false; S.editField = null; S.fixMsg = ''; break;
    case 'setstatus': { const B = snap(); const it = item(S.sel); it.status = a.dataset.to; log(`Item ${it.id} set to ${a.dataset.to} by you.`); S.fixMsg = `Item ${it.id} is now ${a.dataset.to}.`; pushUndo('Mark item ' + it.id + ' ' + a.dataset.to, B); break; }
    case 'togglevalid': { const B = snap(); const it = item(S.sel); it.validated = !it.validated; log(`Item ${it.id} ${it.validated ? 'marked' : 'unmarked'} as verified.`); S.fixMsg = it.validated ? 'Marked as verified.' : 'Verified mark cleared.'; pushUndo((it.validated ? 'Verified mark on item ' : 'Cleared verified mark on item ') + it.id, B); break; }
    case 'editf': S.editField = a.dataset.f; break;
    case 'canceledf': S.editField = null; break;
    case 'saveedf': { const B = snap(); const it = item(S.sel); it[S.editField] = $('#edf').value; log(`Item ${it.id} ${S.editField} edited. The old text stays in the ledger.`); S.fixMsg = `Saved. The old ${S.editField} stays in the ledger.`; S.editField = null; pushUndo('Edit of item ' + it.id, B); break; }
    case 'previewclose': S.closeReason = $('#cr').value; S.previewed = true; S.closeAsk = false; break;
    case 'askclose': S.closeAsk = true; break;
    case 'cancelclose': S.closeAsk = false; break;
    case 'doclose': { const B = snap(); const it = item(S.sel); it.status = 'Closed'; it.reason = S.closeReason; log(`Item ${it.id} closed: ${S.closeReason}.`); if (S.closeReason === 'invalidated') liveLinks().filter(l => l.type === 'depends_on' && l.to === it.id).forEach(l => { const d = item(l.from); if (d.status === 'Active') { d.status = 'Challenged'; log(`Item ${d.id} became Challenged: item ${it.id} was invalidated.`); } }); S.previewed = false; S.closeAsk = false; S.fixMsg = `Item ${it.id} is closed.`; pushUndo('Close item ' + it.id, B); break; }
    case 'rmlink': { const B = snap(); const l = D.links.find(x => x.id === id); l.rejected = true; log(`Link ${id} rejected (not deleted).`); pushUndo('Remove link ' + id, B); break; }
    case 'revsup': { const B = snap(); const l = D.links.find(x => x.id === id); l.rejected = true; const t = item(l.to); if (t.status === 'Closed') { t.status = 'Active'; t.reason = null; } log(`Replacement undone: item ${t.id} is Active again. Link ${id} kept in the ledger.`); pushUndo('Replacement of item ' + t.id, B); break; }
    case 'sweeppreview': S.sweepPreview = true; S.sweepApplied = null; break;
    case 'sweepapply': { S.undo = []; S.redo = []; const ch = sweepChanges(); ch.forEach(c => { const it = item(c.id); it.status = c.to; it.reason = c.reason || null; log(`Item ${c.id} became ${c.to}: ${c.why}.`); }); S.sweepApplied = ch.length; S.sweepChanged = ch.map(c => ({ id: c.id, why: c.why })); S.sweepPreview = false; break; }
    case 'linkyes': { S.undo = []; S.redo = []; const l = LINK_PROPOSALS[S.linkIdx]; D.links.push({ id: D.links.length + 1, from: l.from, to: l.to, type: l.type, rejected: false }); log(`Link added: item ${l.from} ${l.type.replace('_',' ')} item ${l.to}.`); S.linkDone++; S.linkIdx++; break; }
    case 'linkskip': case 'linkno': S.linkSkipped++; S.linkIdx++; break;
    case 'linkreset': S.linkIdx = 0; S.linkDone = 0; S.linkSkipped = 0; break;
    case 'safe': { const k = a.dataset.k; S.safeMsg[k] = k === 'backup' ? `Backup written: backup.db (${D.items.length} items).` : k === 'export' ? `Exported ${D.items.length} items to ember-export.txt.` : 'No problems found.'; break; }
    case 'switchdb': S.safeMsg = { switch: '' }; break;
    case 'set': { const k = a.dataset.k, v = a.dataset.v; if (k === 'Text size') S.scale = v; if (k === 'Colours') S.theme = v.toLowerCase(); S.saved = 'Saved'; break; }
    case 'capture': S.capturing = true; break;
    case 'undo': doUndo(); break;
    case 'redo': doRedo(); break;
    case 'resetkeys': S.shortcutKeys = null; S.saved = 'Saved'; break;
    case 'pane': S.pane = a.dataset.p; S.saved = ''; break;
    case 'cancelcap': S.capturing = false; break;
    case 'moveup': case 'movedown': { const i = S.menuOrder.indexOf(a.dataset.id), j = act === 'moveup' ? i - 1 : i + 1; [S.menuOrder[i], S.menuOrder[j]] = [S.menuOrder[j], S.menuOrder[i]]; S.saved = 'Saved'; break; }
    case 'removekey': S.hasKey = false; S.saved = 'Saved'; break;
    case 'replacekey': S.setupDone = false; S.setupStep = 2; S.keyState = 'idle'; break;
    case 'restartsetup': S.shape = 'full'; S.setupDone = false; S.setupStep = 1; S.keyState = 'idle'; break;
    case 'resetdata': S.undo = []; S.redo = []; D = freshData(); S.addStep = 'input'; S.sweepPreview = false; S.sweepApplied = null; S.linkIdx = 0; S.safeMsg = {}; S.sel = 3; break;
    case 'resetdemo': S.demo = 'normal'; break;
    case 'setupnext': if (S.setupStep === 1) S.dbPath = ($('#dbp') || { value: S.dbPath }).value || S.dbPath; S.setupStep++; break;
    case 'showkey': { const v = $('#key').value; S.keyShown = !S.keyShown; render(); $('#key').value = v; return; }
    case 'skipkey': S.hasKey = false; S.setupStep = 3; break;
    case 'testkey': { const v = $('#key').value.trim(); if (!v) { S.keyState = 'error'; S.keyMsg = 'Paste your key first.'; } else if (v.length < 20) { S.keyState = 'error'; S.keyMsg = 'That key looks too short. Copy the whole key.'; } else if (/bad/i.test(v)) { S.keyState = 'error'; S.keyMsg = 'The service refused that key. Check it and try again.'; } else { S.keyState = 'ok'; S.hasKey = true; } break; }
    case 'finishsetup': S.setupDone = true; S.job = S.hasKey ? 'add' : 'home'; break;
  }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'demostate') { S.demo = e.target.value; if (S.demo !== 'loading' && S.addStep === 'loading') S.addStep = 'input'; render(); }
  if (e.target.id === 'typeface') { S.type = e.target.value; render(); }
  if (e.target.id === 'os') { S.os = e.target.value; render(); }
  if (e.target.id === 'fs') { S.fStatus = e.target.value; render(); }
  if (e.target.id === 'ft') { S.fType = e.target.value; render(); }
  if (e.target.id === 'pp') { S.popPos = e.target.value; S.saved = 'Saved'; render(); }
  if (e.target.dataset.act === 'togglemenu') { const id = e.target.dataset.id; S.menuHidden = e.target.checked ? S.menuHidden.filter(x => x !== id) : [...S.menuHidden, id]; S.saved = 'Saved'; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => {
  if (S.capturing) {
    e.preventDefault();
    if (e.key === 'Escape') { S.capturing = false; render(); return; }
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
    const mods = [e.ctrlKey && 'Control', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean);
    if (!mods.length) return;
    S.shortcutKeys = [...mods, e.key.length === 1 ? e.key.toUpperCase() : e.key]; S.capturing = false; S.saved = 'Saved'; render(); return;
  }
  if ((isMac() ? e.metaKey : e.ctrlKey) && (e.key === 'z' || e.key === 'Z') && S.setupDone && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); render(); return; }
  if ((isMac() ? e.metaKey : e.ctrlKey) && e.key === ',' && S.setupDone && S.shape === 'full') { e.preventDefault(); S.job = 'settings'; render(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('row-click')) { e.target.click(); return; }
  const tag = document.activeElement.tagName;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
  const addLoop = (S.job === 'add' || S.shape === 'pop') && S.addStep === 'props' && !S.editing && S.demo !== 'loading';
  const linkLoop = S.job === 'link' && S.shape === 'full' && S.linkIdx < LINK_PROPOSALS.length && S.demo === 'normal' && !needsKey();
  const map = addLoop ? { y: 'confirm', n: 'rejectp', e: 'edit', q: 'stop', Escape: 'stop' } : linkLoop ? { y: 'linkyes', s: 'linkskip', n: 'linkno' } : null;
  if (e.key === 'Enter' && tag === 'BODY' && (addLoop || linkLoop)) { const el = document.querySelector(`[data-act="${addLoop ? 'confirm' : 'linkyes'}"]`); if (el) { e.preventDefault(); el.click(); } return; }
  if (map && map[e.key]) { const el = document.querySelector(`[data-act="${map[e.key]}"]`); if (el) el.click(); }
});
render();
</script>
