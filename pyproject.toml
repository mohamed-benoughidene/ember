[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.1.0"
description = "Ember: project context management system"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openai>=3.31",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ember = "ember.cli:main"

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.setuptools.package-data]
"ember.adapters.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
